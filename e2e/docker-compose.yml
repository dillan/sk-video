# Reproducible end-to-end harness for the SK Video plugin + KIP video widget.
#
#   mediamtx   — a real RTSP/HLS/WebRTC server fed an ffmpeg test pattern (stands in for a camera)
#   signalk    — Signal K server running the sk-video plugin and serving the KIP webapp
#   onvif      — (opt-in profile) a virtual ONVIF device wrapping the test stream, for PTZ
#
# See README.md. Start the core stack with:  ./run.sh
name: sk-video-e2e

services:
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: skv-mediamtx
    environment:
      MTX_PROTOCOLS: tcp
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./stream-still.sh:/stream-still.sh:ro
      - ./stills:/stills:ro # per-view demo stills (foredeck.jpg, stern.jpg, …); empty is fine
    ports:
      - '8554:8554' # RTSP
      - '8888:8888' # HLS
      - '8889:8889' # WebRTC
    healthcheck:
      test: ['CMD', 'sh', '-c', 'wget -q -O- http://localhost:9997/v3/paths/list || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  signalk:
    build: ./signalk-image # signalk/signalk-server:latest + ffmpeg (for go2rtc snapshots/transcode)
    container_name: skv-signalk
    depends_on:
      mediamtx:
        condition: service_started
    # The image's startup.sh forces --securityenabled; override it to run an open local server
    # (see README — do not expose this stack). The plugin's own security envelope is still in force.
    entrypoint: ['node', '/home/node/signalk/node_modules/signalk-server/bin/signalk-server']
    environment:
      # Let the plugin reach the internet once to fetch the pinned go2rtc binary.
      IS_IN_DOCKER: 'true'
      # Optional: advertise a browser-reachable WebRTC ICE candidate so the host browser can complete
      # WebRTC through the published :8555 (go2rtc otherwise advertises only its unreachable container
      # IP, forcing the fallback to HLS/MJPEG). The screenshot harness sets GO2RTC_CANDIDATES to get the
      # low-latency "happy path"; left empty for the e2e tests, which exercise the fallback walk.
      SKVIDEO_GO2RTC_CANDIDATES: ${GO2RTC_CANDIDATES:-}
    ports:
      - '${SIGNALK_PORT:-3000}:3000'
      - '8555:8555/tcp' # go2rtc WebRTC (ICE) — reachable from the host for representative captures
      - '8555:8555/udp'
    volumes:
      - ./signalk-config:/home/node/.signalk
      # The built plugin (with its node_modules) and the built KIP webapp, mounted read-only.
      - ../:/home/node/.signalk/node_modules/sk-video:ro
      - ${KIP_PATH:-../../kip}:/home/node/.signalk/node_modules/@mxtommy/kip:ro

  # Opt-in: the SAME server image with security ENABLED (the image's default entrypoint keeps
  # --securityenabled), so the auth e2e can prove every mutating plugin route 401s unauthenticated.
  # Fixture admin login: admin / e2e-password (see signalk-config-secured/README.md).
  #   docker compose --profile secured up -d --build signalk-secured
  #   SECURED_URL=http://localhost:3001 npx playwright test tests/auth.e2e.spec.ts
  signalk-secured:
    build: ./signalk-image
    container_name: skv-signalk-secured
    profiles: ['secured']
    environment:
      IS_IN_DOCKER: 'true'
    ports:
      - '${SIGNALK_SECURED_PORT:-3001}:3000'
    volumes:
      - ./signalk-config-secured:/home/node/.signalk
      - ../:/home/node/.signalk/node_modules/sk-video:ro

  # Opt-in: a virtual ONVIF Profile-S device wrapping the mediamtx stream, for exercising PTZ.
  # ONVIF/PTZ are unicast HTTP and work over this network; WS-Discovery needs multicast (see README).
  #   docker compose --profile onvif up --build
  onvif:
    build: ./onvif
    container_name: skv-onvif
    profiles: ['onvif']
    depends_on:
      mediamtx:
        condition: service_started
    volumes:
      - ./onvif/config.yaml:/onvif/config.yaml:ro
    ports:
      - '8081:8081' # ONVIF device service (unicast)
      - '8554' # RTSP passthrough (internal)
